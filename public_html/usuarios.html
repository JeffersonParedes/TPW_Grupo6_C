
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio de Sesión - Olympia Fitness</title>
        <link rel="stylesheet" href="stylesusuarios.css">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    </head>

</head>
<body>

    <div class="contact-container">
        <div class="contact-info">
            <i class="fas fa-user-circle user-icon"></i>
            <h2>Inicia Sesion o registrate para poder acceder a nuestros servicios</h2>
            <ul>
                <li><i class="fas fa-map-marker-alt"></i> Puedes acercar a nuestro local para registrarte</li>
                <li><i class="fas fa-envelope"></i> Usa tu correo para inciar sesion o registrarte</li>
                <li><i class="fas fa-phone"></i> Nuestro numero de contacto +51 947 34 90 11</li>
            </ul>
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>

        <div class="form-container">
            <h2>Iniciar Sesión</h2>
            <form id="loginForm">
                <input type="text" placeholder="Correo Electrónico" required>
                <input type="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
                <button type="button" onclick="showRegister()">Registrarse</button>
            </form>

            <form id="registerForm" style="display:none;">
                <input type="text" placeholder="Nombre Completo" required>
                <input type="text" placeholder="Peso" required>
                <input type="text" placeholder="Altura" required>
                <input type="email" placeholder="Correo Electrónico" required>
                <input type="password" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
                <button type="button" onclick="showLogin()">Volver a Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script>
        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("loginForm").style.display = "block";
            document.getElementById("registerForm").style.display = "none";
        }

    </script>
    <script>
        // Función para simular el inicio de sesión y redirigir al contrato
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Evita que el formulario se envíe de la manera tradicional

            // Aquí podrías verificar el correo y la contraseña
            window.location.href = "contrato.html"; // Redirige a la página de contrato
        });
    </script>


</body>
</html>
