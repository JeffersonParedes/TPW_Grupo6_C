<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - GimnasioDB</title>
    <style>
       
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #2d2d2d;
            color: #f4f4f4;
        }

        h1 {
            text-align: center;
            color: #d4af37; 
            margin-top: 30px;
            font-size: 2.5rem;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            background-color: #3a3a3a;
            padding: 20px;
            border-radius: 10px;
        }

       
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            margin-top: 15px;
            font-size: 1.1rem;
        }

        input[type="text"], select {
            width: 60%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            background-color: #fff;
            color: #333;
        }

        input[type="submit"] {
            width: 30%;
            padding: 12px;
            font-size: 1.2rem;
            background-color: #d4af37;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        input[type="submit"]:hover {
            background-color: #b38b2f; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestión de Pagos</h1>
        <form action="realizar_pago.php" method="POST">
            <label for="usuario">Nombre del Cliente:</label>
            <input type="text" id="usuario" name="usuario" required>

            <label for="monto">Monto a Pagar:</label>
            <input type="text" id="monto" name="monto" required>

            <label for="tipo_pago">Tipo de Pago:</label>
            <select id="tipo_pago" name="tipo_pago">
                <option value="membresía">Membresía</option>
                <option value="servicio adicional">Servicio Adicional</option>
            </select>

            <input type="submit" value="Realizar Pago">
        </form>
    </div>

</body>
</html>
