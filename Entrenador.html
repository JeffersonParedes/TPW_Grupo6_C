<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Entrenador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #f7c02c;
            font-size: 36px;
        }

        p {
            color: #e2e2e2;
            font-size: 18px;
        }

        section#seleccion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            color: #f7c02c;
            display: inline-block;
            margin-right: 5px; /* Espacio reducido */
            text-align: right;
        }

        select, button {
            padding: 10px;
            font-size: 16px;
            color: #333;
            width: 180px;
        }

        button {
            background-color: #f7c02c;
            color: #1a1a1a;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #d4a10e;
        }

        #tablaEntrenadores {
            display: flex;
            justify-content: center;
        }

        table {
            width: 90%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #333;
        }

        table, th, td {
            border: 1px solid #f7c02c;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f7c02c;
            color: #1a1a1a;
        }

        td {
            color: white;
        }

        td button {
            background-color: #48bb78;
            color: white;
            padding: 8px;
            border: none;
            cursor: pointer;
        }

        td button:hover {
            background-color: #38a169;
        }

        footer {
            text-align: center;
            margin-top: 40px;
        }

        footer button {
            background-color: #f7c02c;
            color: #1a1a1a;
            padding: 15px;
            border: none;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        footer button:hover {
            background-color: #d4a10e;
        }
    </style>
</head>
<body>
    <header>
        <h1>Reserva tu Entrenador</h1>
        <p>Selecciona la especialidad y el horario para ver los entrenadores disponibles.</p>
    </header>

    <section id="seleccion">
        <label for="especialidad">Especialidad:</label>
        <select id="especialidad">
            <option value="">Selecciona una especialidad</option>
            <option value="yoga">Yoga</option>
            <option value="pesas">Pesas</option>
            <option value="cardio">Cardio</option>
        </select>

        <label for="horario">Horario:</label>
        <select id="horario">
            <option value="">Selecciona un horario</option>
            <option value="mañana">Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
        </select>

        <button id="mostrarTabla">Mostrar entrenadores</button>
    </section>

    <section id="tablaEntrenadores"></section>

    <footer>
        <button>Únete Ahora</button>
        <button>Contáctanos</button>
    </footer>

    <script>
        const entrenadores = {
            yoga: {
                mañana: [
                    { nombre: "Carlos Pérez", descripcion: "Experto en Hatha Yoga.", intensidad: "Media", tarifa: "$20/h" },
                    { nombre: "Sofía Ramírez", descripcion: "Especialista en Vinyasa.", intensidad: "Alta", tarifa: "$25/h" },
                    { nombre: "Lucía Hernández", descripcion: "Profesora de Kundalini.", intensidad: "Baja", tarifa: "$22/h" },
                    { nombre: "Mario Díaz", descripcion: "Instructor de Yoga terapéutico.", intensidad: "Media", tarifa: "$24/h" },
                    { nombre: "Ana Martín", descripcion: "Instructora de Power Yoga.", intensidad: "Alta", tarifa: "$28/h" }
                ],
                tarde: [
                    { nombre: "Claudia López", descripcion: "Yoga para principiantes.", intensidad: "Baja", tarifa: "$18/h" },
                    { nombre: "Miguel Rodríguez", descripcion: "Yoga dinámico.", intensidad: "Alta", tarifa: "$30/h" },
                    { nombre: "Daniela Vargas", descripcion: "Yoga restaurativo.", intensidad: "Media", tarifa: "$22/h" },
                    { nombre: "José Morales", descripcion: "Instructor de Ashtanga Yoga.", intensidad: "Alta", tarifa: "$26/h" },
                    { nombre: "Elena Suárez", descripcion: "Yoga prenatal.", intensidad: "Baja", tarifa: "$20/h" }
                ],
                noche: [
                    { nombre: "Fernando Ruiz", descripcion: "Yoga para la relajación.", intensidad: "Baja", tarifa: "$19/h" },
                    { nombre: "Valentina Núñez", descripcion: "Yoga de flujo lento.", intensidad: "Media", tarifa: "$23/h" },
                    { nombre: "Patricia Flores", descripcion: "Vinyasa avanzada.", intensidad: "Alta", tarifa: "$28/h" },
                    { nombre: "Juan Sánchez", descripcion: "Power Yoga nocturno.", intensidad: "Alta", tarifa: "$30/h" },
                    { nombre: "María Torres", descripcion: "Yoga suave.", intensidad: "Baja", tarifa: "$18/h" }
                ]
            },
            pesas: {
                mañana: [
                    { nombre: "Roberto Gómez", descripcion: "Entrenamiento de fuerza.", intensidad: "Alta", tarifa: "$25/h" },
                    { nombre: "Alejandra Ortiz", descripcion: "Rutinas de hipertrofia.", intensidad: "Media", tarifa: "$24/h" },
                    { nombre: "Martín Castro", descripcion: "Levantamiento olímpico.", intensidad: "Alta", tarifa: "$30/h" },
                    { nombre: "Luis Fernández", descripcion: "Acondicionamiento físico.", intensidad: "Media", tarifa: "$20/h" },
                    { nombre: "Carla Mendoza", descripcion: "Entrenamiento funcional.", intensidad: "Media", tarifa: "$22/h" }
                ],
                tarde: [
                    { nombre: "Andrés López", descripcion: "Pesas avanzadas.", intensidad: "Alta", tarifa: "$28/h" },
                    { nombre: "Julia Márquez", descripcion: "Entrenamiento de fuerza.", intensidad: "Alta", tarifa: "$26/h" },
                    { nombre: "Ramón Vargas", descripcion: "Pesas intermedias.", intensidad: "Media", tarifa: "$22/h" },
                    { nombre: "Nicolás Rivera", descripcion: "Entrenamiento básico.", intensidad: "Baja", tarifa: "$18/h" },
                    { nombre: "Lorena García", descripcion: "Fuerza y resistencia.", intensidad: "Media", tarifa: "$24/h" }
                ],
                noche: [
                    { nombre: "Diego Salinas", descripcion: "Entrenamiento pesado.", intensidad: "Alta", tarifa: "$30/h" },
                    { nombre: "Gabriela Pérez", descripcion: "Rutinas de musculación.", intensidad: "Media", tarifa: "$22/h" },
                    { nombre: "Esteban Flores", descripcion: "Fuerza avanzada.", intensidad: "Alta", tarifa: "$28/h" },
                    { nombre: "Cecilia Castro", descripcion: "Entrenamiento progresivo.", intensidad: "Media", tarifa: "$20/h" },
                    { nombre: "Francisco González", descripcion: "Levantamiento básico.", intensidad: "Baja", tarifa: "$18/h" }
                ]
            },
            cardio: {
                mañana: [
                    { nombre: "Lorena Chávez", descripcion: "Entrenamiento cardiovascular.", intensidad: "Media", tarifa: "$20/h" },
                    { nombre: "David Méndez", descripcion: "HIIT y cardio intenso.", intensidad: "Alta", tarifa: "$26/h" },
                    { nombre: "Sandra Torres", descripcion: "Cardio ligero.", intensidad: "Baja", tarifa: "$18/h" },
                    { nombre: "Miguel Vera", descripcion: "Entrenamiento aeróbico.", intensidad: "Alta", tarifa: "$28/h" },
                    { nombre: "Raquel Ruiz", descripcion: "Cardio con resistencia.", intensidad: "Media", tarifa: "$22/h" }
                ],
                tarde: [
                    { nombre: "Eduardo Pacheco", descripcion: "Circuitos cardiovasculares.", intensidad: "Media", tarifa: "$24/h" },
                    { nombre: "María Lira", descripcion: "HIIT para principiantes.", intensidad: "Alta", tarifa: "$25/h" },
                    { nombre: "Carlos Herrera", descripcion: "Cardio intermedio.", intensidad: "Media", tarifa: "$22/h" },
                    { nombre: "Verónica Peña", descripcion: "Rutinas de baja intensidad.", intensidad: "Baja", tarifa: "$18/h" },
                    { nombre: "Manuel Díaz", descripcion: "Cardio avanzado.", intensidad: "Alta", tarifa: "$28/h" }
                ],
                noche: [
                    { nombre: "Álvaro Jiménez", descripcion: "Cardio nocturno.", intensidad: "Media", tarifa: "$23/h" },
                    { nombre: "Natalia Cordero", descripcion: "HIIT y tonificación.", intensidad: "Alta", tarifa: "$29/h" },
                    { nombre: "Ricardo Villa", descripcion: "Entrenamiento aeróbico.", intensidad: "Media", tarifa: "$24/h" },
                    { nombre: "Adriana Rojas", descripcion: "Cardio moderado.", intensidad: "Baja", tarifa: "$19/h" },
                    { nombre: "Fernando Paredes", descripcion: "Cardio HIIT.", intensidad: "Alta", tarifa: "$30/h" }
                ]
            }
        };

        document.getElementById("mostrarTabla").addEventListener("click", function() {
            const especialidad = document.getElementById("especialidad").value;
            const horario = document.getElementById("horario").value;

            if (!especialidad || !horario) {
                alert("Por favor selecciona una especialidad y un horario.");
                return;
            }

            const entrenadoresSeleccionados = entrenadores[especialidad][horario];
            let tablaHTML = `<table>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Intensidad</th>
                                    <th>Tarifa</th>
                                    <th>Acción</th>
                                </tr>`;

            entrenadoresSeleccionados.forEach(entrenador => {
                tablaHTML += `<tr>
                                <td>${entrenador.nombre}</td>
                                <td>${entrenador.descripcion}</td>
                                <td>${entrenador.intensidad}</td>
                                <td>${entrenador.tarifa}</td>
                                <td><button>Reservar</button></td>
                              </tr>`;
            });

            tablaHTML += `</table>`;
            document.getElementById("tablaEntrenadores").innerHTML = tablaHTML;
        });
    </script>
</body>
</html>
